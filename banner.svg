<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Taha — secure AI agents and wireless security</title>
  <desc id="d">A signal travels toward a shield-shaped gate. A hostile packet is stopped at the gate while the trusted signal passes through to a small network of agent nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#14213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fb3d9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .name   { font: 700 58px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f4f7fb; letter-spacing: -1px; }
      .role   { font: 600 15px 'Consolas', 'SFMono-Regular', Menlo, monospace; fill: #2dd4bf; letter-spacing: 3px; }
      .line   { font: 400 21px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #b8c4dc; }
      .meta   { font: 400 14px 'Consolas', 'SFMono-Regular', Menlo, monospace; fill: #6f7f9e; letter-spacing: 1px; }
      .flow   { stroke-dasharray: 7 9; animation: flow 1.4s linear infinite; }
      .ring   { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
      .ring.b { animation-delay: 0.9s; }
      .ring.c { animation-delay: 1.8s; }
      .threat { animation: threat 3.2s ease-in infinite; }
      .spark  { animation: spark 3.2s ease-in infinite; }
      .node   { transform-box: fill-box; transform-origin: center; animation: node 3s ease-in-out infinite; }
      .node.b { animation-delay: 0.5s; }
      .node.c { animation-delay: 1s; }
      @keyframes flow   { to { stroke-dashoffset: -32; } }
      @keyframes ring   { 0% { transform: scale(0.4); opacity: 0.8; } 100% { transform: scale(2.4); opacity: 0; } }
      @keyframes threat { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 70% { transform: translate(118px, 38px); opacity: 1; } 78% { transform: translate(118px, 38px); opacity: 0; } 100% { opacity: 0; } }
      @keyframes spark  { 0%, 68% { opacity: 0; transform: scale(0.3); } 74% { opacity: 1; transform: scale(1); } 90%, 100% { opacity: 0; transform: scale(1.8); } }
      @keyframes node   { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { .flow, .ring, .threat, .spark, .node { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#accent)"/>

  <!-- Left: text -->
  <text class="role" x="64" y="82">SECURE AI AGENTS  /  WIRELESS SECURITY</text>
  <text class="name" x="62" y="150">Muhammad Taha</text>
  <rect x="64" y="170" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text class="line" x="64" y="220">Building AI agents that are safe to deploy.</text>
  <text class="meta" x="64" y="262">CS  ·  FAST NUCES  ·  ISLAMABAD, PK</text>

  <!-- Right: signal -> gate -> agents -->
  <g transform="translate(0, 0)">
    <!-- signal source -->
    <circle cx="700" cy="160" r="8" fill="#2dd4bf"/>
    <circle class="ring"   cx="700" cy="160" r="14" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <circle class="ring b" cx="700" cy="160" r="14" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <circle class="ring c" cx="700" cy="160" r="14" fill="none" stroke="#2dd4bf" stroke-width="2"/>

    <!-- trusted path in -->
    <line class="flow" x1="716" y1="160" x2="892" y2="160" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>

    <!-- hostile packet that gets stopped -->
    <g class="threat">
      <circle cx="760" cy="96" r="7" fill="#fb7185"/>
      <path d="M756 92 L764 100 M764 92 L756 100" stroke="#0a1020" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle class="spark" cx="888" cy="130" r="14" fill="none" stroke="#fb7185" stroke-width="2" style="transform-box: fill-box; transform-origin: center;"/>

    <!-- gate: shield + lock -->
    <path d="M940 104 L988 122 V170 C988 198 968 216 940 228 C912 216 892 198 892 170 V122 Z"
          fill="#0f1c33" stroke="url(#accent)" stroke-width="3"/>
    <rect x="924" y="158" width="32" height="26" rx="5" fill="#2dd4bf"/>
    <path d="M931 158 V150 A9 9 0 0 1 949 150 V158" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <circle cx="940" cy="170" r="3.5" fill="#0a1020"/>

    <!-- trusted path out -->
    <line class="flow" x1="990" y1="160" x2="1044" y2="160" stroke="#a3e635" stroke-width="3" stroke-linecap="round"/>

    <!-- agent network -->
    <g stroke="#a3e635" stroke-opacity="0.55" stroke-width="2">
      <line x1="1060" y1="160" x2="1110" y2="110"/>
      <line x1="1060" y1="160" x2="1110" y2="210"/>
      <line x1="1110" y1="110" x2="1150" y2="160"/>
      <line x1="1110" y1="210" x2="1150" y2="160"/>
    </g>
    <circle class="node"   cx="1060" cy="160" r="9"  fill="#a3e635"/>
    <circle class="node b" cx="1110" cy="110" r="8"  fill="#a3e635"/>
    <circle class="node c" cx="1110" cy="210" r="8"  fill="#a3e635"/>
    <circle class="node b" cx="1150" cy="160" r="7"  fill="#a3e635"/>

    <text class="meta" x="700" y="262">signal</text>
    <text class="meta" x="912" y="262">gate</text>
    <text class="meta" x="1066" y="262">agents</text>
  </g>
</svg>
